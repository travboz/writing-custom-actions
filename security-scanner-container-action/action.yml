# Docker action configuration containing inputs and outputs
name: Security Scanner
description: Runs security vulnerability scans on your codebase
author: travboz

inputs:
  scan-path:
    description: Path to scan for vulnerabilities
    required: false
    default: .
  security-threshold:
    description: Minimum severity to report (low, medium, high, critical)
    required: false
    default: medium

outputs:
  vulnerabilities-found:
    description: Number of vulnerabilities found
  report-path:
    description: Path to the generated path

# Specify a Docker container because this is a Docker Container Action
runs:
  using: docker
  image: Dockerfile
  args:
    - ${{ inputs.scan-path }}
    - ${{ inputs.severity-threshold }}
